[[IgnoredVulns]]
id = "GHSA-vjh5-4x84-xrqp"
ignoreUntil = 2027-01-31
reason = "False positive on nuxt and @nuxt/nitro-server 4.6.2, the fixed version. GitHub limits the 3.x range with database_specific.last_known_affected_version_range < 4.0.0, which OSV-Scanner ignores, so the range is read as open-ended. All Nuxt templates are on 4.6.2."

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2027-01-31
reason = "minimatch < 11.0.1. Outside dev dependencies it reaches only the Nuxt templates' build tooling (archiver > readdir-glob, vite-plugin-checker > eslint), which matches patterns from code and config, not user input. The fix is minimatch 11, which removes makeRe() and the AST class that those packages use. Runtime glob paths are on glob 14 with minimatch 11."

[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
ignoreUntil = 2027-01-31
reason = "deepmerge <= 4.3.1 has no fixed release. It is reached only at build time through @rollup/plugin-node-resolve (Nuxt) and @sveltejs/vite-plugin-svelte, which merge config objects, not user input."

[[IgnoredVulns]]
id = "GHSA-7f5c-rpf4-86p8"
ignoreUntil = 2027-01-31
reason = "hbs <= 4.4.0 has no fixed release. api-reference passes res.render() view models with fixed top-level keys; query values only reach nested fields, so a request cannot set engine options such as layout or settings."

[[PackageOverrides]]
name = ".*"
nameIsRegex = true
ecosystem = "npm"
group = "dev"
vulnerability.ignore = true
reason = "Dev dependencies are not shipped. Matches the production-only PR audit (npm audit --omit=dev)."
