<svg xmlns="http://www.w3.org/2000/svg" width="620" height="400" viewBox="0 0 620 400" role="img" aria-label="Terminal session where tapeline captures webhook events, forwards them to localhost, and suggests a replay command after a failed delivery">
  <defs>
    <linearGradient id="frame-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2fd4e6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0e94a8" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect x="7" y="7" width="606" height="386" rx="16" fill="none" stroke="url(#frame-glow)" stroke-width="2"/>
  <rect x="9" y="9" width="602" height="382" rx="14" fill="#0b1a20"/>
  <g>
    <circle cx="32" cy="33" r="5.5" fill="#ff5f57"/>
    <circle cx="52" cy="33" r="5.5" fill="#febc2e"/>
    <circle cx="72" cy="33" r="5.5" fill="#28c840"/>
    <text x="310" y="37.5" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#5d7d86">tapeline — listen</text>
  </g>
  <line x1="9" y1="54" x2="611" y2="54" stroke="#16303a" stroke-width="1"/>
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13.5" xml:space="preserve">
    <text x="30" y="88"><tspan fill="#5d7d86">$ </tspan><tspan fill="#eaf7f9">tapeline listen --forward http://localhost:3000/webhooks</tspan></text>
    <text x="30" y="115"><tspan fill="#38d39f">✔</tspan><tspan fill="#b6c9cd"> listening on </tspan><tspan fill="#7fd6e4">http://127.0.0.1:8787/hooks</tspan></text>
    <text x="30" y="142"><tspan fill="#38d39f">✔</tspan><tspan fill="#b6c9cd"> recording to </tspan><tspan fill="#7fd6e4">.tapeline/events.ndjson</tspan></text>
    <text x="30" y="196"><tspan fill="#5d7d86">12:04:11  </tspan><tspan fill="#7fd6e4">POST</tspan><tspan fill="#b6c9cd"> /hooks  </tspan><tspan fill="#eaf7f9">payment.settled</tspan><tspan fill="#5d7d86">   → </tspan><tspan fill="#38d39f">200</tspan><tspan fill="#5d7d86"> in 41 ms</tspan></text>
    <text x="30" y="223"><tspan fill="#5d7d86">12:04:19  </tspan><tspan fill="#7fd6e4">POST</tspan><tspan fill="#b6c9cd"> /hooks  </tspan><tspan fill="#eaf7f9">invoice.created</tspan><tspan fill="#5d7d86">   → </tspan><tspan fill="#38d39f">200</tspan><tspan fill="#5d7d86"> in 12 ms</tspan></text>
    <text x="30" y="250"><tspan fill="#5d7d86">12:05:02  </tspan><tspan fill="#7fd6e4">POST</tspan><tspan fill="#b6c9cd"> /hooks  </tspan><tspan fill="#eaf7f9">customer.updated</tspan><tspan fill="#5d7d86">  → </tspan><tspan fill="#ff6b6b">500</tspan><tspan fill="#5d7d86"> in 9 ms</tspan></text>
    <text x="30" y="277"><tspan fill="#5d7d86">          fix your handler, then: </tspan><tspan fill="#7fd6e4">tapeline replay evt_9f3kq2</tspan></text>
    <text x="30" y="331"><tspan fill="#5d7d86">$ </tspan><tspan fill="#eaf7f9">tapeline replay evt_9f3kq2</tspan></text>
    <text x="30" y="358"><tspan fill="#38d39f">✔</tspan><tspan fill="#b6c9cd"> replayed </tspan><tspan fill="#eaf7f9">customer.updated</tspan><tspan fill="#5d7d86"> → </tspan><tspan fill="#38d39f">200</tspan><tspan fill="#5d7d86"> in 18 ms</tspan></text>
  </g>
</svg>
