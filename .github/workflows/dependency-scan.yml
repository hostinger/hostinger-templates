name: Dependency scan

on:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/dependency-scan.yml"
  workflow_dispatch:

concurrency:
  group: dependency-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      scan-args: |-
        --recursive
        ./
      fail-on-vuln: ${{ github.event_name != 'pull_request' }}
      upload-sarif: ${{ github.event_name != 'pull_request' }}

  notify:
    needs: scan
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SCAN_RESULT: ${{ needs.scan.result }}
      ISSUE_TITLE: "Dependency scan: vulnerable dependencies on main"
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ALERTS_URL: ${{ github.server_url }}/${{ github.repository }}/security/code-scanning?query=is%3Aopen+branch%3Amain+tool%3Aosv-scanner
    steps:
      - name: Open, update or close the tracking issue
        run: |
          set -euo pipefail
          existing=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number,title \
            --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number // empty")

          if [ "$SCAN_RESULT" = "success" ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "Scan $RUN_URL found no vulnerable dependencies. Closing."
            fi
            exit 0
          fi

          body=$(printf 'OSV-Scanner run %s did not pass (result: `%s`).\n\nOpen findings: %s\n\nFix the advisories in the affected templates, or record accepted risks in `osv-scanner.toml`. This issue closes on the next passing scan.' "$RUN_URL" "$SCAN_RESULT" "$ALERTS_URL")

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$ISSUE_TITLE" --body "$body"
          fi
