name: Dependency graph refresh

on:
  schedule:
    - cron: "47 4 * * *"
  push:
    branches: [main]
    paths:
      - "templates/**/package-lock.json"
  pull_request:
    paths:
      - ".github/workflows/dependency-graph-refresh.yml"
  workflow_dispatch:

concurrency:
  group: dependency-graph-refresh-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Submit npm dependency snapshot
        uses: advanced-security/component-detection-dependency-submission-action@9887d3a4295305f4e7b03a1cfdb2099d44cadf52 # v0.2.1
        with:
          filePath: templates
          detectorsFilter: NpmLockfile3
          correlator: daily-npm-graph-refresh
          fail-on-empty: "true"
