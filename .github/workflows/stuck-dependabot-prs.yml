name: Stuck Dependabot PRs

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: read

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_TITLE: "Dependabot PRs stuck for more than 24 hours"
      STUCK_AFTER_HOURS: "24"
    steps:
      - name: Open, update or close the tracking issue
        run: |
          set -euo pipefail
          existing=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number,title \
            --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number // empty")

          cutoff=$(date -u -d "-$STUCK_AFTER_HOURS hours" +%Y-%m-%dT%H:%M:%SZ)
          stuck=$(gh pr list --state open --author "app/dependabot" --limit 100 --json number,title,createdAt \
            --jq "map(select(.createdAt < \"$cutoff\")) | .[] | \"- #\(.number) \(.title) (opened \(.createdAt[:10]))\"")

          if [ -z "$stuck" ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "No Dependabot PR has been open for more than $STUCK_AFTER_HOURS hours. Closing."
            fi
            exit 0
          fi

          body=$(printf 'Dependabot PRs open for more than %s hours:\n\n%s\n\nCheck their failing checks or the auto-merge run comments.\n\nThis issue closes on the next run with no stuck Dependabot PRs.' "$STUCK_AFTER_HOURS" "$stuck")

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$ISSUE_TITLE" --body "$body"
          fi
