name: Dependabot auto-merge

# Runs on the default branch after the gate workflow, so GitHub injects
# organization Actions secrets (HOSTINGERBOT_APP_ID / HOSTINGERBOT_PRIVATE_KEY).
# A Dependabot `pull_request` job cannot see those — only Dependabot secrets.
on:
  workflow_run:
    workflows: [Dependabot auto-merge gate]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  auto-merge:
    # Gate on the PR author, not who last pushed. A human rebase of a
    # Dependabot PR must still auto-merge.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Get GitHub token
        uses: actions/create-github-app-token@v3
        id: get_token
        with:
          app-id: ${{ secrets.HOSTINGERBOT_APP_ID }}
          private-key: ${{ secrets.HOSTINGERBOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ steps.get_token.outputs.token }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          json=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --state open --json number,url,author)
          # gh reports Dependabot as app/dependabot; the pull_request event uses dependabot[bot].
          pr=$(echo "$json" | jq -c '[.[] | select(.author.login == "dependabot[bot]" or .author.login == "app/dependabot")] | .[0]')
          if [[ -z "$pr" || "$pr" == "null" ]]; then
            echo "No open Dependabot PR for $HEAD_BRANCH"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "number=$(echo "$pr" | jq -r '.number')" >> "$GITHUB_OUTPUT"
          echo "url=$(echo "$pr" | jq -r '.url')" >> "$GITHUB_OUTPUT"

      # Do not use dependabot/fetch-metadata here. It requires a pull_request
      # event payload; workflow_run does not have one. This repo only opens
      # Dependabot security PRs (open-pull-requests-limit: 0), so author is
      # enough. Merge after every other check is green. Do not watch this job
      # itself or `gh pr checks --watch` waits forever.
      - name: Wait for other checks
        id: checks
        if: steps.pr.outputs.found == 'true'
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
          GH_TOKEN: ${{ steps.get_token.outputs.token }}
          THIS_WORKFLOW: Dependabot auto-merge
          GATE_WORKFLOW: Dependabot auto-merge gate
          PREVIEW_WORKFLOW: Template preview
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 3600))
          while (( SECONDS < deadline )); do
            json=$(gh pr checks "$PR_URL" --json name,state,bucket,workflow 2>/dev/null) || json='[]'
            echo "$json" | jq -c '.[] | {name,state,bucket,workflow}'
            others=$(echo "$json" | jq -c --arg w "$THIS_WORKFLOW" --arg g "$GATE_WORKFLOW" \
              '[.[] | select(.workflow != $w and .workflow != $g)]')
            pending=$(echo "$others" | jq \
              'if length == 0 then 1 else [.[] | select(.state == "PENDING" or .state == "QUEUED" or .state == "IN_PROGRESS" or .bucket == "pending")] | length end')
            if [[ "$pending" == "0" ]]; then
              failed=$(echo "$others" | jq -c \
                '[.[] | select(.bucket == "fail" or .state == "FAILURE" or .state == "CANCELLED" or .state == "TIMED_OUT")]')
              if [[ "$failed" == "[]" ]]; then
                echo "All other checks passed."
                echo "result=passed" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              previews=$(echo "$others" | jq --arg p "$PREVIEW_WORKFLOW" \
                '[.[] | select(.workflow == $p and (.name | test("^preview \\(.+\\)$")))] | length')
              trimmable=$(echo "$failed" | jq -r --arg p "$PREVIEW_WORKFLOW" \
                'if all(.[]; .workflow == $p and (.name | test("^preview \\(.+\\)$")))
                 then [.[].name | capture("^preview \\((?<t>.+)\\)$").t] | join(" ") else "" end')
              failed_count=$(echo "$failed" | jq 'length')
              echo "failed_checks=$(echo "$failed" | jq -r '[.[].name] | join(", ")')" >> "$GITHUB_OUTPUT"
              if [[ -n "$trimmable" && "$failed_count" -lt "$previews" ]]; then
                echo "Only template previews failed: $trimmable"
                echo "result=trim" >> "$GITHUB_OUTPUT"
                echo "templates=$trimmable" >> "$GITHUB_OUTPUT"
              else
                echo "A required check failed; not merging."
                echo "result=failed" >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi
            echo "Waiting on $pending check(s)..."
            sleep 60
          done
          echo "Timed out waiting for checks."
          echo "result=timeout" >> "$GITHUB_OUTPUT"

      - name: Check out pull request branch
        if: steps.checks.outputs.result == 'trim'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          token: ${{ steps.get_token.outputs.token }}

      - name: Drop failing templates
        if: steps.checks.outputs.result == 'trim'
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
          GH_TOKEN: ${{ steps.get_token.outputs.token }}
          TEMPLATES: ${{ steps.checks.outputs.templates }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$BASE_BRANCH"
          for template in $TEMPLATES; do
            if [[ ! "$template" =~ ^[a-z0-9-]+$ ]]; then
              echo "::error::Unexpected template name: $template"
              exit 1
            fi
            git checkout FETCH_HEAD -- "templates/$template"
          done
          git -c user.name="hostingerbot[bot]" -c user.email="hostingerbot[bot]@users.noreply.github.com" \
            commit -m "chore(deps): drop templates that fail preview from security group" \
            -m "Restores $(echo "$TEMPLATES" | sed 's/ /, /g') to $BASE_BRANCH. Their updates need a manual fix."
          git push origin HEAD
          list=$(for template in $TEMPLATES; do printf -- '- `%s`\n' "$template"; done)
          gh pr comment "$PR_URL" --body "$(printf 'Dropped these templates from this PR because their `Template preview` check failed:\n\n%s\n\nThe rest of the PR merges once checks pass again. The dropped updates need a manual fix, usually a framework major upgrade. Their alerts stay open. Run: %s' "$list" "$RUN_URL")"

      - name: Report blocked PR
        if: steps.checks.outputs.result == 'failed' || steps.checks.outputs.result == 'timeout'
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
          GH_TOKEN: ${{ steps.get_token.outputs.token }}
          RESULT: ${{ steps.checks.outputs.result }}
          FAILED_CHECKS: ${{ steps.checks.outputs.failed_checks }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "$RESULT" == "timeout" ]]; then
            reason="Checks did not finish within an hour."
          else
            reason="Failed checks: $FAILED_CHECKS. They are not only template previews, or every template failed, so nothing was dropped automatically."
          fi
          gh pr comment "$PR_URL" --body "$(printf 'Auto-merge is blocked. %s\n\nFix the failures or close this PR. Run: %s' "$reason" "$RUN_URL")"
          exit 1

      - name: Approve PR
        if: steps.checks.outputs.result == 'passed'
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
          GH_TOKEN: ${{ steps.get_token.outputs.token }}
        run: gh pr review --approve "$PR_URL"

      - name: Merge PR
        if: steps.checks.outputs.result == 'passed'
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
          GH_TOKEN: ${{ steps.get_token.outputs.token }}
        run: gh pr merge --squash "$PR_URL" || gh pr merge --auto --squash "$PR_URL"
