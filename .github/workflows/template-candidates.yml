name: Template candidates

on:
  workflow_dispatch:
    inputs:
      repositories:
        description: owner/repo[:app/dir] entries separated by spaces. The private scan in hostinger-templates-automation sends the ones it picked.
        required: true
      limit:
        description: Most PRs to open in this run.
        required: false
        default: "5"

permissions:
  contents: read

concurrency:
  group: template-candidates
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      candidates: ${{ steps.pick.outputs.candidates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Evaluate the repositories
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORIES: ${{ inputs.repositories }}
        run: |
          set -euo pipefail
          read -r -a targets <<< "$REPOSITORIES"
          node .github/scripts/evaluate-repos.mjs "${targets[@]}" --out results.json
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          LIMIT: ${{ inputs.limit || '5' }}
        run: node .github/scripts/template-candidates.mjs pick --results results.json --limit "$LIMIT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: template-candidates
          path: candidates.json
          retention-days: 7

  prepare:
    needs: pick
    if: needs.pick.outputs.candidates != '[]' && needs.pick.outputs.candidates != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        candidate: ${{ fromJson(needs.pick.outputs.candidates) }}
    env:
      ID: ${{ matrix.candidate.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: template-candidates
      - name: Copy the repository at its pin
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/template-candidates.mjs prepare "$ID"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.prepare.outputs.node-version }}
      - name: Install
        run: node .github/scripts/template-commands.mjs install "templates/$ID"
      - name: Build
        run: node .github/scripts/template-commands.mjs build "templates/$ID"
      - name: Find the build output
        run: node .github/scripts/template-candidates.mjs settle "$ID"
      - name: Audit
        run: node .github/scripts/audit-regression.mjs "templates/$ID" HEAD
      - name: Install preview scripts
        working-directory: .github/scripts
        run: |
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get install -y -qq webp
      - name: Serve and capture the screenshots
        env:
          PORT: 4173
          TEMPLATE_ID: ${{ matrix.candidate.id }}
          PREVIEW_OUT: ${{ runner.temp }}/shots
        run: node .github/scripts/healthcheck.mjs "templates/$ID" || true
      - name: Keep the screenshots
        run: node .github/scripts/template-candidates.mjs capture "$ID" --from "$RUNNER_TEMP/shots" --out "$RUNNER_TEMP/prepared"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prepared-${{ matrix.candidate.id }}
          path: ${{ runner.temp }}/prepared
          retention-days: 7
